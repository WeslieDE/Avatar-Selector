name: Build catalog & deploy Pages

on:
  push:
    branches: [main]
    paths:
      - "Avatars/**"
      - "Images/**"
      - "scripts/**"
      - ".github/workflows/build-catalog.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: pip install "Pillow==11.0.0"

      - name: Build avatars.json + atlas textures
        run: python scripts/build_catalog.py --avatars Avatars --images Images --out _site

      - name: Add index page
        run: |
          cat > _site/index.html <<'EOF'
          <!doctype html><meta charset="utf-8"><title>Avatar-Selector</title>
          <p>Data source for the VRChat avatar catalog: <a href="avatars.json">avatars.json</a></p>
          EOF

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
